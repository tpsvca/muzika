name: Release

# Tag a version and this publishes a signed APK:
#     git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # The secrets context is not allowed in a step-level `if`, so it is
      # resolved once here into a plain string.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Exported for the build step only when it actually ran. Unset, the
      # Gradle config falls back to an unsigned build - which is exactly what
      # a fork with no secrets should get.
      - name: Restore keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/muzika.jks"
          echo "MUZIKA_KEYSTORE=$RUNNER_TEMP/muzika.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          MUZIKA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MUZIKA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MUZIKA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect and verify the APK
        run: |
          mkdir -p out
          src=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          version="${GITHUB_REF_NAME#v}"
          cp "$src" "out/muzika-${version}.apk"
          ls -l out
          # Prove what was actually produced rather than assuming it was signed.
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$signer" verify --print-certs "out/muzika-${version}.apk" || \
            echo "::warning::APK is unsigned (no keystore secret configured)"

      - uses: actions/upload-artifact@v4
        with:
          name: muzika-release-apk
          path: out/*.apk

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          body: |
            Install the APK below on Android 8.0 or newer.

            Muzika needs no account. On first run it asks for all-files access,
            which is only used for the sync folder that carries your library
            (and your music files) between devices.
