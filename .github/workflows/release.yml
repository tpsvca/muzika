name: Release

# Tag a version and this publishes a signed APK:
#     git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The keystore only ever exists on the runner, reconstructed from the
      # secret. Skipping this step is what makes a fork's build unsigned
      # rather than broken.
      - name: Restore keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/muzika.jks"

      - name: Build release APK
        working-directory: android
        env:
          MUZIKA_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/muzika.jks', runner.temp) || '' }}
          MUZIKA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MUZIKA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MUZIKA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the artifact after the tag
        run: |
          mkdir -p out
          src=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$src" "out/muzika-${GITHUB_REF_NAME#v}.apk"
          ls -l out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          body: |
            Install the APK below on Android 8.0 or newer.

            Muzika needs no account. On first run it asks for all-files access,
            which is only used for the sync folder that carries your library
            (and your music files) between devices.
