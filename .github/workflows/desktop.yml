name: Desktop

on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # PyGObject needs the GTK stack present even to import, so the check is
      # deliberately a compile + import-free lint rather than a fake headless run.
      - name: Byte-compile every module
        run: python -m compileall -q desktop/muzika

      - name: Lint
        run: |
          pip install ruff
          ruff check desktop/muzika --select E9,F63,F7,F82
